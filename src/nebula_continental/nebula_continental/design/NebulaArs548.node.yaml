autoware_system_design_format: 0.4.1

name: NebulaArs548.node

description: Nebula driver for the Continental ARS548 radar.

package:
  name: nebula_continental
  provider: nebula

launch:
  plugin: nebula::ros::ContinentalARS548RosWrapper
  executable: continental_ars548_ros_wrapper_node
  node_output: screen

# interfaces
subscribers: []
publishers: []

# parameters
param_files:
  - name: config_file
    default: config/ARS548.param.yaml
    schema: schema/ARS548.schema.json
    allow_substs: true

param_values:
  - name: launch_hw
    type: bool
    default: true
  - name: radar_info_rate_subsample
    type: int
    default: 10

# processes
processes: []
