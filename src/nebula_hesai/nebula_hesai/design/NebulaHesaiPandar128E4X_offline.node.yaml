autoware_system_design_format: 0.4.1

name: NebulaHesaiPandar128E4X_offline.node

description: Nebula driver for the Hesai Pandar128E4X, replaying recorded packets.

base: NebulaHesaiPandar128E4X.node

override:
  subscribers:
    - name: pandar_packets
      message_type: pandar_msgs/msg/PandarScan
      remap_target: pandar_packets
  publishers:
    - name: pandar_points
      message_type: sensor_msgs/msg/PointCloud2
      remap_target: pandar_points
      qos:
        depth: 10
        reliability: best_effort
    - name: aw_points
      message_type: sensor_msgs/msg/PointCloud2
      remap_target: aw_points
      qos:
        depth: 10
        reliability: best_effort
    - name: aw_points_ex
      message_type: sensor_msgs/msg/PointCloud2
      remap_target: aw_points_ex
      qos:
        depth: 10
        reliability: best_effort
    - name: blockage_mask
      message_type: sensor_msgs/msg/Image
      remap_target: blockage_mask
    - name: diagnostics
      message_type: diagnostic_msgs/msg/DiagnosticArray
      global: /diagnostics
  param_values:
    - name: launch_hw
      type: bool
      default: false
  processes:
    - name: decoder
      description: Decodes each recorded scan.
      trigger_conditions:
        - and:
            - on_input: pandar_packets
            - periodic: 10 # Hz
      outcomes:
        - to_output: pandar_points
        - to_output: aw_points
        - to_output: aw_points_ex
        - to_output: blockage_mask
        - to_queue: decode_status
    - name: diagnose_decoder
      description: Decoder diagnostics.
      trigger_conditions:
        - periodic: 10 # Hz
      reads:
        - from_queue: decode_status
      outcomes:
        - to_output: diagnostics
