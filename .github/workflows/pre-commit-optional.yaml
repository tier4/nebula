# This file is automatically synced from:
# https://github.com/autowarefoundation/sync-file-templates
# To make changes, update the source repository and follow the guidelines in its README.

name: pre-commit-optional

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit-optional:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Inlined from autowarefoundation/autoware-github-actions/pre-commit and pre-commit/action,
      # which reference other actions by tag. Autofixes are not pushed back, as this workflow
      # only has read access to the repository.
      - name: Install pre-commit
        run: |
          python -m pip install pre-commit
          python -m pip freeze --local

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config-optional.yaml') }}

      - name: Run pre-commit
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          pre-commit run --show-diff-on-failure --color=always \
            --config .pre-commit-config-optional.yaml \
            --from-ref "${BASE_REF}" --to-ref HEAD
