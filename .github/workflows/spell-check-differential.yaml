# This file is automatically synced from:
# https://github.com/autowarefoundation/sync-file-templates
# To make changes, update the source repository and follow the guidelines in its README.

name: spell-check-differential

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spell-check-differential:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inlined from autowarefoundation/autoware-github-actions/spell-check, which references
      # streetsidesoftware/cspell-action by tag.
      - name: Install dict packages
        run: |
          npm install https://github.com/autowarefoundation/autoware-spell-check-dict
          npm install https://github.com/tier4/cspell-dicts

      - name: Retrieve remote dictionary
        run: |
          curl -fsSL -o remote.cspell.json \
            https://raw.githubusercontent.com/autowarefoundation/autoware-spell-check-dict/main/.cspell.json

      - name: Prepare local dictionary
        run: |
          if [ -f .cspell.json ]; then
            cp .cspell.json local.cspell.json
          else
            echo "No local dictionary found."
            echo "{}" > local.cspell.json
          fi

      - name: Create combined dictionary
        run: |
          echo '{ "import": ["./remote.cspell.json", "./local.cspell.json"] }' > .cspell.json

      - name: Run spell check
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        with:
          config: .cspell.json
          incremental_files_only: true
