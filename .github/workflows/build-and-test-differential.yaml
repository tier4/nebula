name: build-and-test-differential

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test-differential:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    container: ros:${{ matrix.rosdistro }}
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [humble, jazzy]
        enable_agnocast: [0, 1]
    env:
      CCACHE_DIR: /root/.ccache
      CC: /usr/lib/ccache/gcc
      CXX: /usr/lib/ccache/g++
      ENABLE_AGNOCAST: ${{ matrix.enable_agnocast }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove exec_depend
        uses: autowarefoundation/autoware-github-actions/remove-exec-depend@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1

      - name: Get modified packages
        id: get-modified-packages
        uses: autowarefoundation/autoware-github-actions/get-modified-packages@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1

      - run: ./.github/workflows/scripts/ensure-apt-up-to-date.sh
      - run: ./.github/workflows/scripts/setup-ccache.sh

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Clear ccache stats
        run: |
          ccache --zero-stats
        shell: bash

      - name: Build
        id: build
        if: steps.get-modified-packages.outputs.modified-packages != ''
        uses: ./.github/actions/colcon-build
        with:
          rosdistro: ${{ matrix.rosdistro }}
          target-packages: ${{ steps.get-modified-packages.outputs.modified-packages }}
          build-depends-repos: build_depends-${{ matrix.rosdistro }}.repos

      - name: Show ccache stats after build
        run: |
          du -sh ${CCACHE_DIR} && ccache -s
        shell: bash

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        uses: ./.github/actions/colcon-test
        env:
          # The test runner has no Agnocast kernel module / heaphook, so nodes built with
          # Agnocast support are exercised in rclcpp mode at test time.
          ENABLE_AGNOCAST: 0
        with:
          rosdistro: ${{ matrix.rosdistro }}
          # With ENABLE_AGNOCAST=0, colcon no longer resolves the conditional agnocastlib
          # dependency, so its env hooks would not be sourced for the tests. Source the
          # built workspace instead so that libagnocast.so is found at runtime.
          underlay-workspace: install
          target-packages: ${{ steps.get-modified-packages.outputs.modified-packages }}
          build-depends-repos: build_depends-${{ matrix.rosdistro }}.repos

      - name: Determine CodeCov flags from modified packages
        id: determine-flags
        if: steps.test.outputs.coverage-report-files != ''
        shell: bash
        env:
          MODIFIED_PACKAGES: ${{ steps.get-modified-packages.outputs.modified-packages }}
        run: |
          modified_packages="${MODIFIED_PACKAGES}"
          flags="$(tr -s '[:space:]' '\n' <<<"$modified_packages" | awk 'NF && !seen[$0]++' | paste -sd, -)"

          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "Modified packages: $modified_packages"
          echo "Determined flags: $flags"

      - name: Upload coverage to CodeCov
        if: steps.test.outputs.coverage-report-files != '' && matrix.rosdistro == 'humble' && steps.determine-flags.outputs.flags != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ steps.test.outputs.coverage-report-files }}
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: ${{ steps.determine-flags.outputs.flags }}

  fb-infer-differential:
    if: contains(github.event.pull_request.labels.*.name, 'run:fb-infer')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: ros:${{ matrix.rosdistro }}
    strategy:
      fail-fast: false
      matrix:
        rosdistro:
          - humble
        ref:
          - ${{ github.event.pull_request.head.sha }}
          - ${{ github.event.pull_request.base.sha }}
    env:
      # Compilation with Clang is required for FB Infer
      CC: /usr/lib/ccache/clang-15
      CXX: /usr/lib/ccache/clang++-15
      CCACHE_DIR: /root/.ccache
      FB_INFER_VERSION: 1.2.0
    steps:
      - name: Check out PR repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get modified packages
        id: get-modified-packages
        uses: autowarefoundation/autoware-github-actions/get-modified-packages@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1

      - name: Back up .github folder
        run: |
          cp -r .github /tmp/.github-backup

      - name: Checkout matrix ref code
        id: checkout-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ matrix.ref }}

      - name: Restore .github folder
        run: |
          rm -rf .github
          mv /tmp/.github-backup .github

      - run: ./.github/workflows/scripts/ensure-apt-up-to-date.sh
      - run: ./.github/workflows/scripts/setup-ccache.sh
      - run: ./.github/workflows/scripts/setup-clang.sh
      - run: ./.github/workflows/scripts/setup-infer.sh

      - name: Cache analysis results
        id: cache-analysis
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: infer-out/
          key: infer-${{ matrix.ref }}-${{ runner.os }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.cache-analysis.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Clear ccache stats
        if: steps.cache-analysis.outputs.cache-hit != 'true'
        run: |
          ccache --zero-stats
        shell: bash

      - name: Remove exec_depend
        if: steps.cache-analysis.outputs.cache-hit != 'true'
        uses: autowarefoundation/autoware-github-actions/remove-exec-depend@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1

      - name: Build
        id: build
        if: steps.cache-analysis.outputs.cache-hit != 'true'
        uses: ./.github/actions/colcon-build
        with:
          rosdistro: ${{ matrix.rosdistro }}
          target-packages: ${{ steps.get-modified-packages.outputs.modified-packages }}
          build-depends-repos: build_depends-${{ matrix.rosdistro }}.repos
          cmake-build-type: Debug  # Faster compilation than Release

      - name: Show ccache stats after build
        if: steps.cache-analysis.outputs.cache-hit != 'true'
        run: |
          du -sh ${CCACHE_DIR} && ccache -s
        shell: bash

      - name: Analyze using Facebook Infer
        id: fb-analyze
        if: steps.cache-analysis.outputs.cache-hit != 'true'
        run: |
          infer capture --compilation-database build/compile_commands.json
          # Produces an `infer-out/` directory in the current working directory
          infer analyze

      - name: Upload FB Infer Reports
        id: upload-infer-reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infer-report-${{ matrix.ref }}
          path: |
            infer-out/report.json
          if-no-files-found: error

  fb-infer-report:
    if: contains(github.event.pull_request.labels.*.name, 'run:fb-infer')
    runs-on: ubuntu-latest
    needs: [fb-infer-differential]
    permissions:
      contents: read
      pull-requests: write # Post the FB Infer summary comment
    env:
      FB_INFER_VERSION: 1.2.0
    steps:
      - name: Check out GitHub workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This repo checkout is only for .github workflow definitions. Use the feature branch's version as it might contain updated functionality.
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/
      - run: ./.github/workflows/scripts/ensure-apt-up-to-date.sh
      - run: ./.github/workflows/scripts/setup-infer.sh

      - name: Download FB Infer report (PR head ref)
        id: download-infer-reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infer-report-${{ github.event.pull_request.head.sha }}
          path: infer-report-head

      - name: Download FB Infer report (PR base ref)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infer-report-${{ github.event.pull_request.base.sha }}
          path: infer-report-base

      - name: Compare reports
        run: |
          # Produces an `infer-out/` directory in the current working directory
          infer reportdiff \
            --report-current infer-report-head/report.json \
            --report-previous infer-report-base/report.json

      - name: Annotate files with FB Infer results
        run: |
          python3 ./.github/workflows/scripts/annotate-with-infer-diff.py \
            infer-out/differential/introduced.json

      - name: Upload FB Infer Reports
        id: upload-infer-reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infer-reports-${{ github.sha }}
          path: |
            infer-report-head/report.json
            infer-out/*
          if-no-files-found: error

      - name: Generate Infer summary
        id: generate-infer-summary
        env:
          ARTIFACT_URL: ${{ steps.upload-infer-reports.outputs.artifact-url }}
        run: |
          python3 .github/workflows/scripts/summarize-infer-diff.py \
            infer-out/differential \
            "${ARTIFACT_URL}" \
            infer-summary.md

      - name: Find Comment
        if: ${{ steps.generate-infer-summary.outcome == 'success' }}
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: FB Infer

      # If the comment-id is empty, this creates a new comment
      - name: Post or update PR comment
        if: ${{ steps.generate-infer-summary.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@23ff15729ef2fc348714a3bb66d2f655ca9066f2 # v3.1.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: infer-summary.md
          edit-mode: replace
