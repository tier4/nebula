name: build-and-test

on:
  push:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions: {}

jobs:
  build-and-test:
    if: ${{ github.event_name != 'push' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    container: ros:${{ matrix.rosdistro }}
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [humble, jazzy]
        enable_agnocast: [0, 1]
    env:
      CCACHE_DIR: /root/.ccache
      CCACHE_SIZE: 1G  # The GitHub cache action allows for 10G but the runners' disk space is limited
      CC: /usr/lib/ccache/gcc
      CXX: /usr/lib/ccache/g++
      ENABLE_AGNOCAST: ${{ matrix.enable_agnocast }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@76866dbe54312617f00798d1762df7f43def6e5c # v1.2.0
        with:
          tool-cache: false
          dotnet: false
          swap-storage: false
          large-packages: false

      - name: Remove exec_depend
        uses: autowarefoundation/autoware-github-actions/remove-exec-depend@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1

      - name: Get self packages
        id: get-self-packages
        uses: autowarefoundation/autoware-github-actions/get-self-packages@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
        shell: bash

      - name: Create ccache directory
        run: |
          mkdir -p ${CCACHE_DIR}
          du -sh ${CCACHE_DIR} && ccache -s
        shell: bash

      - name: Limit ccache size
        run: |
          rm -f "${CCACHE_DIR}/ccache.conf"
          echo -e "max_size = ${CCACHE_SIZE}" > "${CCACHE_DIR}/ccache.conf"
        shell: bash

      - name: Attempt to restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.arch }}-${{ matrix.rosdistro }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ matrix.rosdistro }}-

      - name: Show ccache stats before build and reset stats
        run: |
          du -sh ${CCACHE_DIR} && ccache -s
          ccache --zero-stats
        shell: bash

      - name: Build
        if: ${{ steps.get-self-packages.outputs.self-packages != '' }}
        uses: autowarefoundation/autoware-github-actions/colcon-build@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1
        with:
          rosdistro: ${{ matrix.rosdistro }}
          target-packages: ${{ steps.get-self-packages.outputs.self-packages }}
          build-depends-repos: build_depends-${{ matrix.rosdistro }}.repos

      - name: Show ccache stats after build
        run: |
          du -sh ${CCACHE_DIR} && ccache -s
        shell: bash

      - name: Upload ccache to cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.arch }}-${{ matrix.rosdistro }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test
        if: ${{ steps.get-self-packages.outputs.self-packages != '' }}
        id: test
        uses: autowarefoundation/autoware-github-actions/colcon-test@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1
        env:
          # The test runner has no Agnocast kernel module / heaphook, so nodes built with
          # Agnocast support are exercised in rclcpp mode at test time.
          ENABLE_AGNOCAST: 0
        with:
          rosdistro: ${{ matrix.rosdistro }}
          # With ENABLE_AGNOCAST=0, colcon no longer resolves the conditional agnocastlib
          # dependency, so its env hooks would not be sourced for the tests. Source the
          # built workspace instead so that libagnocast.so is found at runtime.
          underlay-workspace: install
          target-packages: ${{ steps.get-self-packages.outputs.self-packages }}
          build-depends-repos: build_depends-${{ matrix.rosdistro }}.repos

      - name: Upload coverage to CodeCov
        if: ${{ steps.test.outputs.coverage-report-files != '' && matrix.enable_agnocast == 0 }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ steps.test.outputs.coverage-report-files }}
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: total
