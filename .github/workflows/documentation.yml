# cspell: ignore nojekyll
name: documentation
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [closed]

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      - name: Install Doxygen
        run: sudo apt update && sudo apt install -y doxygen

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Generate API reference
        run: |
          rm -rf .mkdoxy
          mkdocs build --config-file scripts/mkdoxy_gen.yml

      - name: Preprocess documentation
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 scripts/preprocess_zensical_docs.py \
            --mkdoxy-dir .mkdoxy \
            --site-url "https://${REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/"

      - name: Build documentation site
        run: |
          zensical build --config-file .zensical.toml

      - name: Verify API reference output
        run: test -f _site/core/links/index.html

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Fix file permissions
        run: |
          chmod -c -R +rX "_site/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
