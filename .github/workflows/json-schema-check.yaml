name: json-schema-check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-if-relevant-files-changed:
    runs-on: ubuntu-latest
    outputs:
      run-check: ${{ steps.paths_filter.outputs.json_or_yaml }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: paths_filter
        with:
          filters: |
            json_or_yaml:
              - '**/schema/*.schema.json'
              - '**/config/**/*.param.yaml'

  json-schema-check:
    needs: check-if-relevant-files-changed
    if: needs.check-if-relevant-files-changed.outputs.run-check == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run json-schema-check
        uses: autowarefoundation/autoware-github-actions/json-schema-check@3419182c5e20616d2ca4c81c73ef94199eb26172 # v1.69.1

  no-relevant-changes:
    needs: check-if-relevant-files-changed
    if: needs.check-if-relevant-files-changed.outputs.run-check == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Dummy step
        run: echo "No relevant changes, passing check"
