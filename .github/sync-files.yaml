- repository: autowarefoundation/sync-file-templates
  source-dir: sources
  files:
    - source: .github/dependabot.yaml
    - source: .github/workflows/pre-commit-optional.yaml
    - source: .github/workflows/semantic-pull-request.yaml
    - source: .github/workflows/spell-check-differential.yaml
    - source: .github/workflows/sync-files.yaml
    - source: .github/workflows/lint-autoware-system-design-format.yaml
    - source: .clang-format
    - source: .markdown-link-check.json
    - source: .markdownlint.yaml
    - source: .pre-commit-config.yaml
      # Re-apply Nebula's cpplint deviation that the raw sync would clobber: keep the
      # -runtime/arrays and -readability/casting filters. runtime/arrays infers const-ness
      # from the variable name, which clashes with our naming conventions; readability/casting
      # flags intentional C-style casts in the socket code. (-build/c++17 now lives in the
      # synced CPPLINT.cfg.)
      pre-commands: |
        sed -i "s|args: \[--quiet\]|args: [--quiet, '--filter=-runtime/arrays,-readability/casting']|" {source}
    - source: .pre-commit-config-optional.yaml
    - source: .prettierignore
      # Nebula's calibration data files (e.g. the velodyne .yaml files) use a flow style
      # that Prettier and yamllint format incompatibly, so keep all *.yaml Prettier-ignored
      # as before (yamllint still lints them).
      pre-commands: |
        sed -i 's|\*\.param\.yaml|*.yaml|' {source}
    - source: .prettierrc.yaml
    - source: .yamllint.yaml
    - source: CPPLINT.cfg
    - source: setup.cfg

# Mirror the autoware::agnocast_wrapper package from autoware.core into nebula, renamed into the
# nebula::agnocast_wrapper / NEBULA_ namespace. Sources are synced alongside the headers: node.cpp
# and runtime.cpp hold the out-of-line definitions for node.hpp and runtime.hpp, and leaving them
# out leaves every ENABLE_AGNOCAST=1 consumer linking against undefined symbols. The one file left
# out is polling_subscriber.hpp, the autoware_utils_rclcpp bridge, so that nebula never pulls
# autoware_utils_rclcpp - that file is the wrapper's only autoware_utils dependency, and nothing
# else in the package includes it.
- repository: autowarefoundation/autoware.core
  files:
    - source: common/autoware_agnocast_wrapper/include/autoware/agnocast_wrapper/autoware_agnocast_wrapper.hpp
      dest: src/nebula_core/nebula_core_ros/include/nebula_core_ros/agnocast_wrapper/nebula_agnocast_wrapper.hpp
      pre-commands: |
        sd 'autoware::agnocast_wrapper' 'nebula::agnocast_wrapper' {source}
        sd 'AUTOWARE_' 'NEBULA_' {source}
        sd 'autoware/agnocast_wrapper/' 'nebula_core_ros/agnocast_wrapper/' {source}
        sd 'autoware_agnocast_wrapper.hpp' 'nebula_agnocast_wrapper.hpp' {source}
    - source: common/autoware_agnocast_wrapper/include/autoware/agnocast_wrapper/client.hpp
      dest: src/nebula_core/nebula_core_ros/include/nebula_core_ros/agnocast_wrapper/client.hpp
